name: CI

on:
  pull_request:
  push:
    branches: [ main , NgJunWei ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.11", "3.12" ]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
          pip install ruff==0.15.21

      - name: Debug versions
        run: |
          pwd
          ls -la
          python --version
          pip --version
          ruff --version
          black --version
          echo "===== pyproject.toml ====="
          cat pyproject.toml
          echo "===== Ruff Settings ====="
          ruff check . --show-settings

      - name: Lint
        run: |
          ruff check .
          black --check .

      - name: Type check
        run: |
          mypy --explicit-package-bases src

      - name: Test
        run: |
          pytest --maxfail=1 --disable-warnings -vv --tb=short --cov=src --cov-report=xml

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml