<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HostelEase — Admin Bookings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --navy-950: #071a33;
  --navy-900: #0b2545;
  --navy-800: #123566;
  --blue-600: #2f6fed;
  --blue-500: #4f86f7;
  --sky-400: #7fb0ff;
  --sky-100: #eaf2ff;
  --white: #ffffff;
  --slate-600: #5b6b82;
  --slate-400: #8fa0b8;
  --border: #dce6f5;
  --success-bg: #e8f7ef;
  --success-fg: #1f8a55;
  --error-bg: #fdeceb;
  --error-fg: #c8352d;
  --warning-bg: #fff4e0;
  --warning-fg: #b3760b;

  --font-display: 'Space Grotesk', 'Segoe UI', sans-serif;
  --font-body: 'Inter', 'Segoe UI', sans-serif;

  --radius-lg: 20px;
  --radius-md: 12px;
  --radius-sm: 8px;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: var(--font-body);
  color: var(--navy-900);
  background: var(--sky-100);
}
img, svg { display: block; }
button { font-family: inherit; }
a { color: inherit; }

/* ===================== Prototype switcher (not part of product UI) ===================== */
.proto-bar {
  position: sticky;
  top: 0;
  z-index: 100;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
  padding: 10px 20px;
  background: var(--navy-950);
  border-bottom: 1px dashed rgba(127,176,255,0.4);
}
.proto-label {
  font-family: var(--font-display);
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--sky-400);
  margin-right: 4px;
}
.proto-group { display: flex; gap: 6px; flex-wrap: wrap; }
.proto-btn {
  font-size: 12.5px;
  font-weight: 600;
  padding: 6px 12px;
  border-radius: 999px;
  border: 1px solid rgba(127,176,255,0.35);
  background: transparent;
  color: #c7d9f5;
  cursor: pointer;
  transition: background 0.15s ease, color 0.15s ease;
}
.proto-btn:hover { background: rgba(127,176,255,0.12); }
.proto-btn.active { background: var(--sky-400); color: var(--navy-950); border-color: var(--sky-400); }
.proto-divider { width: 1px; height: 20px; background: rgba(127,176,255,0.25); margin: 0 2px; }

/* ===================== Shared top nav ===================== */
.topnav {
  background: var(--navy-900);
  color: var(--white);
}
.topnav-inner {
  max-width: 1180px;
  margin: 0 auto;
  padding: 16px 24px;
  display: flex;
  align-items: center;
  gap: 24px;
}
.brand-mark {
  display: flex;
  align-items: center;
  gap: 8px;
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 18px;
}
.brand-mark svg { color: var(--sky-400); flex-shrink: 0; }
.eyebrow-chip {
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--sky-400);
  border: 1px solid rgba(127,176,255,0.35);
  padding: 4px 9px;
  border-radius: 999px;
  white-space: nowrap;
}
.nav-links {
  display: flex;
  gap: 22px;
  margin-left: 8px;
  font-size: 14px;
  font-weight: 500;
  color: #c7d9f5;
  flex: 1;
}
.nav-links a { text-decoration: none; }
.nav-links a.current { color: var(--white); font-weight: 600; }
.nav-links a.nav-disabled { color: #6d84a8; opacity: 0.55; cursor: not-allowed; pointer-events: none; }
.nav-links a:hover { color: var(--white); }
.nav-right { display: flex; align-items: center; gap: 14px; }
.icon-btn {
  border: none;
  background: rgba(255,255,255,0.06);
  color: #c7d9f5;
  width: 36px; height: 36px;
  border-radius: 999px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  position: relative;
}
.icon-btn:hover { background: rgba(255,255,255,0.14); }
.icon-btn .dot {
  position: absolute; top: 6px; right: 6px;
  width: 7px; height: 7px; border-radius: 50%;
  background: #ff8a65; border: 1.5px solid var(--navy-900);
}
.avatar-chip {
  display: flex; align-items: center; gap: 9px;
  padding: 5px 12px 5px 6px;
  border-radius: 999px;
  background: rgba(255,255,255,0.06);
  cursor: pointer;
}
.avatar-chip:hover { background: rgba(255,255,255,0.14); }
.avatar-circle {
  width: 26px; height: 26px; border-radius: 50%;
  background: linear-gradient(135deg, var(--sky-400), var(--blue-600));
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-display); font-weight: 600; font-size: 11px; color: var(--navy-950);
}
.avatar-name { font-size: 13.5px; font-weight: 600; }

@media (max-width: 860px) {
  .nav-links { display: none; }
}

/* ===================== Layout shells ===================== */
main { max-width: 1180px; margin: 0 auto; padding: 36px 24px 72px; }
.app[hidden] { display: none; }
.view[hidden] { display: none; }

.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin: 44px 0 18px; flex-wrap: wrap; }
.section-head h2 { font-family: var(--font-display); font-size: 20px; font-weight: 600; margin: 0; }
.section-head p { margin: 4px 0 0; font-size: 13.5px; color: var(--slate-600); }
.section-head:first-of-type { margin-top: 0; }

/* ===================== Buttons & chips ===================== */
.btn-primary {
  padding: 11px 18px;
  font-size: 14px;
  font-weight: 600;
  color: var(--white);
  background: var(--blue-600);
  border: none;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: background 0.15s ease, transform 0.05s ease;
  white-space: nowrap;
}
.btn-primary:hover { background: #285fd6; }
.btn-primary:active { transform: translateY(1px); }
.btn-secondary {
  padding: 10px 17px;
  font-size: 14px;
  font-weight: 600;
  color: var(--navy-900);
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  cursor: pointer;
  white-space: nowrap;
}
.btn-secondary:hover { background: var(--sky-100); }
.btn-ghost {
  padding: 9px 14px;
  font-size: 13.5px;
  font-weight: 600;
  color: var(--blue-600);
  background: transparent;
  border: none;
  cursor: pointer;
}
.btn-ghost:hover { text-decoration: underline; }
.btn-sm { padding: 7px 12px; font-size: 12.5px; border-radius: 7px; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--blue-600); outline-offset: 2px; }

.chip {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 12px; font-weight: 600;
  padding: 4px 10px; border-radius: 999px;
}
.chip-blue { background: var(--sky-100); color: var(--blue-600); }
.chip-navy { background: rgba(11,37,69,0.06); color: var(--navy-900); }

.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; padding: 5px 11px; border-radius: 999px; }
.pill-success { background: var(--success-bg); color: var(--success-fg); }
.pill-warning { background: var(--warning-bg); color: var(--warning-fg); }
.pill-error { background: var(--error-bg); color: var(--error-fg); }
.pill svg { width: 12px; height: 12px; }

/* ===================== Cards ===================== */
.card {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
}

/* ---- Student: browsing hero + window strip ---- */
.hero-browse {
  position: relative;
  overflow: hidden;
  background: linear-gradient(150deg, var(--navy-950) 0%, var(--navy-900) 60%, var(--navy-800) 100%);
  border-radius: var(--radius-lg);
  color: var(--white);
  padding: 34px 32px;
}
.hero-browse .hero-top { max-width: 560px; position: relative; z-index: 1; }
.hero-browse h1 { font-family: var(--font-display); font-size: 28px; font-weight: 600; margin: 0 0 8px; line-height: 1.3; }
.hero-browse p { margin: 0; color: #c7d9f5; font-size: 14.5px; line-height: 1.6; }
.hero-strip {
  position: absolute; right: -10px; bottom: -10px; top: 18%;
  width: 46%;
  display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px;
  padding: 10px;
  opacity: 0.9;
}
.hero-strip span { aspect-ratio: 1/1.15; border-radius: 3px; background: rgba(127,176,255,0.08); }
.hero-strip span.lit { background: var(--sky-400); box-shadow: 0 0 10px 1px rgba(127,176,255,0.55); animation: flicker 5s ease-in-out infinite; }
@keyframes flicker { 0%,100%{opacity:1;} 45%{opacity:.55;} 55%{opacity:.9;} }
@media (prefers-reduced-motion: reduce) { .hero-strip span.lit { animation: none; } }
@media (max-width: 760px) { .hero-strip { display: none; } }

/* ---- Filter bar ---- */
.filter-bar {
  display: flex; flex-wrap: wrap; align-items: end; gap: 14px;
  background: var(--white); border: 1px solid var(--border); border-radius: var(--radius-md);
  padding: 16px 18px; margin-top: -20px; position: relative; z-index: 2;
  box-shadow: 0 10px 30px -18px rgba(11,37,69,0.35);
}
.filter-field { display: flex; flex-direction: column; gap: 6px; min-width: 150px; }
.filter-field label { font-size: 12px; font-weight: 600; color: var(--slate-600); }
.filter-field select {
  padding: 9px 10px; font-size: 13.5px; font-family: var(--font-body); color: var(--navy-900);
  background: var(--sky-100); border: 1px solid var(--border); border-radius: var(--radius-sm);
  outline: none;
}
.filter-field select:focus-visible { border-color: var(--blue-600); box-shadow: 0 0 0 3px rgba(47,111,237,0.18); }
.filter-actions { display: flex; gap: 8px; margin-left: auto; }

/* ---- Room grid ---- */
.room-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; margin-top: 20px; }
@media (max-width: 980px) { .room-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 640px) { .room-grid { grid-template-columns: 1fr; } }

.room-card { overflow: hidden; display: flex; flex-direction: column; transition: box-shadow .15s ease, transform .15s ease; }
.room-card:hover { box-shadow: 0 14px 34px -20px rgba(11,37,69,0.4); transform: translateY(-2px); }
.room-photo {
  height: 130px;
  background: linear-gradient(135deg, var(--sky-100), #dbe9ff);
  display: flex; align-items: center; justify-content: center;
  color: var(--sky-400);
  position: relative;
}
.room-photo svg { width: 34px; height: 34px; }
.room-photo .avail-badge {
  position: absolute; top: 10px; right: 10px;
}
.room-body { padding: 16px 16px 18px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
.room-title-row { display: flex; align-items: start; justify-content: space-between; gap: 8px; }
.room-title { font-family: var(--font-display); font-size: 15.5px; font-weight: 600; margin: 0; }
.room-block { font-size: 12.5px; color: var(--slate-600); margin: 2px 0 0; }
.room-meta { display: flex; gap: 14px; font-size: 12.5px; color: var(--slate-600); }
.room-meta span { display: flex; align-items: center; gap: 5px; }
.room-meta svg { width: 14px; height: 14px; color: var(--slate-400); }
.room-fee { font-family: var(--font-display); font-size: 17px; font-weight: 600; color: var(--navy-900); }
.room-fee small { font-family: var(--font-body); font-size: 12px; font-weight: 500; color: var(--slate-600); }
.room-footer { display: flex; gap: 8px; margin-top: auto; }
.room-footer .btn-secondary, .room-footer .btn-primary { flex: 1; text-align: center; }

/* ---- Student: booked status ---- */
.status-hero {
  background: var(--white); border: 1px solid var(--border); border-radius: var(--radius-lg);
  padding: 28px 30px; display: flex; gap: 28px; flex-wrap: wrap; align-items: center;
  position: relative; overflow: hidden;
}
.status-hero::before {
  content: ""; position: absolute; inset: 0; width: 6px; background: var(--success-fg);
}
.status-left { flex: 1; min-width: 260px; }
.status-eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--slate-600); margin: 0 0 6px; }
.status-room { font-family: var(--font-display); font-size: 24px; font-weight: 600; margin: 0 0 10px; }
.status-meta-row { display: flex; flex-wrap: wrap; gap: 18px; font-size: 13.5px; color: var(--slate-600); margin-top: 6px; }
.status-meta-row strong { color: var(--navy-900); }
.status-actions { display: flex; flex-direction: column; gap: 10px; min-width: 190px; }

.quick-actions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-top: 20px; }
@media (max-width: 860px) { .quick-actions { grid-template-columns: repeat(2, 1fr); } }
.quick-action {
  display: flex; flex-direction: column; gap: 10px; align-items: flex-start;
  padding: 18px; text-align: left; cursor: pointer;
}
.quick-action .qa-icon {
  width: 38px; height: 38px; border-radius: 10px; background: var(--sky-100); color: var(--blue-600);
  display: flex; align-items: center; justify-content: center;
}
.quick-action .qa-icon svg { width: 19px; height: 19px; }
.quick-action strong { font-size: 14px; }
.quick-action span.desc { font-size: 12.5px; color: var(--slate-600); line-height: 1.4; }

.timeline { display: flex; flex-direction: column; }
.timeline-item { display: flex; gap: 14px; padding: 0 0 22px; position: relative; }
.timeline-item:last-child { padding-bottom: 0; }
.timeline-dot-col { display: flex; flex-direction: column; align-items: center; }
.timeline-dot { width: 12px; height: 12px; border-radius: 50%; background: var(--blue-600); flex-shrink: 0; margin-top: 3px; }
.timeline-item.done .timeline-dot { background: var(--success-fg); }
.timeline-line { width: 2px; flex: 1; background: var(--border); margin-top: 4px; }
.timeline-item:last-child .timeline-line { display: none; }
.timeline-content strong { font-size: 13.5px; display: block; }
.timeline-content span { font-size: 12.5px; color: var(--slate-600); }

/* ---- Admin dashboard ---- */
.dash-hero { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.dash-hero h1 { font-family: var(--font-display); font-size: 24px; font-weight: 600; margin: 0 0 6px; }
.dash-hero p { margin: 0; font-size: 13.5px; color: var(--slate-600); }
.semester-select {
  padding: 9px 12px; font-size: 13.5px; font-family: var(--font-body); color: var(--navy-900);
  background: var(--white); border: 1px solid var(--border); border-radius: var(--radius-sm);
}

.stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-top: 20px; }
@media (max-width: 980px) { .stat-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 560px) { .stat-grid { grid-template-columns: 1fr; } }
.stat-card { padding: 18px 20px; display: flex; flex-direction: column; gap: 6px; }
.stat-card .stat-label { font-size: 12.5px; color: var(--slate-600); font-weight: 600; display: flex; align-items: center; gap: 7px; }
.stat-card .stat-label svg { width: 15px; height: 15px; color: var(--slate-400); }
.stat-card .stat-value { font-family: var(--font-display); font-size: 26px; font-weight: 600; }
.stat-card .stat-sub { font-size: 12px; color: var(--slate-600); }
.stat-card.attention .stat-value { color: var(--warning-fg); }

.occ-panel { display: flex; gap: 22px; align-items: center; padding: 20px 22px; margin-top: 14px; flex-wrap: wrap; }
.occ-grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 5px; width: 210px; }
.occ-grid span { aspect-ratio: 1/1; border-radius: 3px; background: var(--sky-100); }
.occ-grid span.lit { background: var(--blue-600); }
.occ-copy strong.big { font-family: var(--font-display); font-size: 28px; display: block; }
.occ-copy p { margin: 4px 0 0; font-size: 13px; color: var(--slate-600); max-width: 320px; }

.request-list { display: flex; flex-direction: column; gap: 12px; margin-top: 16px; }
.request-row {
  display: flex; align-items: center; gap: 16px; padding: 15px 18px;
}
.request-icon {
  width: 40px; height: 40px; border-radius: 10px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  background: var(--sky-100); color: var(--blue-600);
}
.request-icon svg { width: 19px; height: 19px; }
.request-main { flex: 1; min-width: 0; }
.request-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.request-title { font-size: 14px; font-weight: 600; }
.request-sub { font-size: 12.5px; color: var(--slate-600); margin-top: 3px; }
.request-time { font-size: 12px; color: var(--slate-400); white-space: nowrap; }
.request-actions { display: flex; gap: 8px; flex-shrink: 0; }

.empty-state {
  display: flex; flex-direction: column; align-items: center; text-align: center;
  padding: 52px 24px; gap: 12px; margin-top: 16px;
}
.empty-state .empty-icon {
  width: 56px; height: 56px; border-radius: 50%; background: var(--success-bg); color: var(--success-fg);
  display: flex; align-items: center; justify-content: center; margin-bottom: 4px;
}
.empty-state .empty-icon svg { width: 26px; height: 26px; }
.empty-state h3 { font-family: var(--font-display); font-size: 17px; margin: 0; }
.empty-state p { margin: 0; font-size: 13.5px; color: var(--slate-600); max-width: 380px; }
.empty-state .empty-actions { display: flex; gap: 10px; margin-top: 10px; }

.two-col { display: grid; grid-template-columns: 1.6fr 1fr; gap: 20px; align-items: start; }
@media (max-width: 980px) { .two-col { grid-template-columns: 1fr; } }
.side-card { padding: 20px 20px 22px; }
.side-card h3 { font-family: var(--font-display); font-size: 15px; margin: 0 0 4px; }
.side-card p.hint { margin: 0 0 16px; font-size: 12.5px; color: var(--slate-600); }
.mini-stat-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 13.5px; }
.mini-stat-row:last-child { border-bottom: none; }
.mini-stat-row strong { font-family: var(--font-display); font-size: 15px; }

/* ===================== Extra: forms, tables, filters (added for Bookings/Maintenance/Rooms pages) ===================== */
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-top: 14px; }
.form-field { display: flex; flex-direction: column; gap: 6px; }
.form-field label { font-size: 12px; font-weight: 600; color: var(--slate-600); }
.form-field input, .form-field select {
  padding: 9px 10px; font-size: 13.5px; font-family: var(--font-body); color: var(--navy-900);
  background: var(--sky-100); border: 1px solid var(--border); border-radius: var(--radius-sm);
  outline: none;
}
.form-field input:focus-visible, .form-field select:focus-visible { border-color: var(--blue-600); box-shadow: 0 0 0 3px rgba(47,111,237,0.18); }
.form-actions { display: flex; gap: 10px; margin-top: 16px; }

.room-table { width: 100%; border-collapse: collapse; margin-top: 16px; }
.room-table th, .room-table td { text-align: left; padding: 12px 14px; border-bottom: 1px solid var(--border); font-size: 13.5px; }
.room-table th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--slate-600); font-weight: 600; }
.room-table tr:last-child td { border-bottom: none; }
.room-table tr.inactive-row td { opacity: 0.5; }
.room-table td.actions-cell { display: flex; gap: 8px; }

.status-filter { display: flex; gap: 8px; align-items: center; }
.status-filter select {
  padding: 9px 12px; font-size: 13.5px; font-family: var(--font-body); color: var(--navy-900);
  background: var(--white); border: 1px solid var(--border); border-radius: var(--radius-sm);
}

.quick-link-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 20px; }
@media (max-width: 860px) { .quick-link-grid { grid-template-columns: 1fr; } }
.quick-link-card {
  display: flex; flex-direction: column; gap: 10px; padding: 20px; text-decoration: none; color: inherit;
  transition: box-shadow .15s ease, transform .15s ease;
}
.quick-link-card:hover { box-shadow: 0 14px 34px -20px rgba(11,37,69,0.4); transform: translateY(-2px); }
.quick-link-card .qa-icon {
  width: 38px; height: 38px; border-radius: 10px; background: var(--sky-100); color: var(--blue-600);
  display: flex; align-items: center; justify-content: center;
}
.quick-link-card .qa-icon svg { width: 19px; height: 19px; }
.quick-link-card strong { font-family: var(--font-display); font-size: 15.5px; }
.quick-link-card span.desc { font-size: 12.5px; color: var(--slate-600); line-height: 1.4; }
</style>

</head>
<body>

<div id="adminApp" class="app">
  <header class="topnav">
    <div class="topnav-inner">
      <div class="brand-mark">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M3 10.5L12 3l9 7.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 9.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>HostelEase</span>
      </div>
      <span class="eyebrow-chip">Admin Console</span>
      <nav class="nav-links">
        <a href="admin-dashboard.html">Dashboard</a>
        <a href="admin-bookings.html" class="current">Bookings</a>
        <a href="admin-rooms.html">Rooms</a>
        <a href="admin-maintenance.html">Maintenance</a>
        <a href="#" class="nav-disabled" title="Coming soon">Visitors</a>
        <a href="#" class="nav-disabled" title="Coming soon">Reports</a>
      </nav>
      <div class="nav-right">
        <button class="icon-btn" aria-label="Notifications"><svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M6 8a6 6 0 0 1 12 0c0 4.5 1.5 6 1.5 6h-15S6 12.5 6 8Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M10 18a2 2 0 0 0 4 0" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg><span class="dot"></span></button>
        <div class="avatar-chip"><div class="avatar-circle" id="avatarInitials">AD</div><span class="avatar-name" id="avatarName">Admin</span></div>
      <button class="btn-secondary btn-sm" id="logoutBtn" style="margin-left:6px;">Log out</button>
      </div>
    </div>
  </header>

  <main>
    <div class="section-head" style="margin-top:0;">
      <div>
        <h2>Bookings</h2>
        <p id="bookingCountSub">Loading…</p>
      </div>
      <div class="status-filter">
        <label for="statusFilter" style="font-size:12.5px; font-weight:600; color:var(--slate-600);">Status</label>
        <select id="statusFilter">
          <option value="pending" selected>Pending</option>
          <option value="approved">Approved</option>
          <option value="rejected">Rejected</option>
          <option value="cancelled">Cancelled</option>
          <option value="all">All</option>
        </select>
      </div>
    </div>
    <div class="request-list" id="bookingList">
      <p style="color:var(--slate-600);">Loading bookings…</p>
    </div>
  </main>
</div>

<script>
  function getToken() {
    return window.localStorage.getItem('access_token') || window.sessionStorage.getItem('access_token');
  }

  document.getElementById('logoutBtn').addEventListener('click', async () => {
    const token = getToken();
    try {
      if (token) {
        await fetch('/auth/logout', { method: 'POST', headers: { 'Authorization': `Bearer ${token}` } });
      }
    } catch (err) {
      // Even if the server call fails (e.g. offline), still clear the
      // local session so the user is signed out on this device.
    }
    window.localStorage.removeItem('access_token');
    window.localStorage.removeItem('refresh_token');
    window.localStorage.removeItem('user');
    window.sessionStorage.removeItem('access_token');
    window.sessionStorage.removeItem('refresh_token');
    window.sessionStorage.removeItem('user');
    window.location.href = 'login.html';
  });

  function authHeaders() {
    return { 'Authorization': `Bearer ${getToken()}` };
  }

  function statusPillHTML(status) {
    const statusPillClass = { pending: 'pill-warning', approved: 'pill-success', rejected: 'pill-error', cancelled: 'pill-error' }[status] || 'pill-warning';
    const label = { pending: 'Pending', approved: 'Approved', rejected: 'Rejected', cancelled: 'Cancelled' }[status] || status;
    return `<span class="pill ${statusPillClass}">${label}</span>`;
  }

  function bookingRowHTML(b) {
    const requestedAgo = new Date(b.requested_at).toLocaleDateString();
    const actions = b.status === 'pending'
      ? `<button class="btn-secondary btn-sm" data-action="reject" data-id="${b.id}">Reject</button>
         <button class="btn-primary btn-sm" data-action="approve" data-id="${b.id}">Approve</button>`
      : statusPillHTML(b.status);
    return `
      <div class="request-row card" data-booking-id="${b.id}">
        <div class="request-icon"><svg viewBox="0 0 24 24" fill="none"><rect x="4" y="5" width="16" height="15" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M4 10h16" stroke="currentColor" stroke-width="1.6"/></svg></div>
        <div class="request-main">
          <div class="request-top"><span class="request-title">Booking application — ${b.student_name}</span><span class="chip chip-blue">Booking</span></div>
          <p class="request-sub">Requested ${b.room_label} · ${b.semester}${b.student_id ? ' · ' + b.student_id : ''} · RM ${b.total_fee.toFixed(0)}/mo${b.occupant_count === 2 ? ` · 2 occupants (2nd: ${b.extra_occupant_name || 'unnamed'}, ${b.extra_occupant_gender || '—'}, ${b.extra_occupant_student_id || '—'}, ${b.extra_occupant_email || '—'})` : ' · 1 occupant'}</p>
        </div>
        <span class="request-time">${requestedAgo}</span>
        <div class="request-actions">${actions}</div>
      </div>`;
  }

  function transferRequestRowHTML(t) {
    const requestedAgo = new Date(t.requested_at).toLocaleDateString();
    const actions = t.status === 'pending'
      ? `<button class="btn-secondary btn-sm" data-action="reject-transfer" data-id="${t.id}">Reject</button>
         <button class="btn-primary btn-sm" data-action="approve-transfer" data-id="${t.id}">Approve</button>`
      : statusPillHTML(t.status);
    return `
      <div class="request-row card" data-transfer-id="${t.id}">
        <div class="request-icon"><svg viewBox="0 0 24 24" fill="none"><path d="M4 12h12M10 6l6 6-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M16 6h4v4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
        <div class="request-main">
          <div class="request-top"><span class="request-title">Transfer request — ${t.student_name}</span><span class="chip chip-navy">Transfer</span></div>
          <p class="request-sub">Requested to move from ${t.room_label} to ${t.requested_room_label}${t.reason ? ` · Reason: ${t.reason}` : ''}</p>
        </div>
        <span class="request-time">${requestedAgo}</span>
        <div class="request-actions">${actions}</div>
      </div>`;
  }

  async function loadBookings() {
    const token = getToken();
    if (!token) { window.location.href = 'login.html'; return; }

    const status = document.getElementById('statusFilter').value;
    const list = document.getElementById('bookingList');
    list.innerHTML = '<p style="color:var(--slate-600);">Loading bookings…</p>';

    try {
      const [bookingsRes, transfersRes] = await Promise.all([
        fetch(`/admin/bookings?status=${encodeURIComponent(status)}`, { headers: authHeaders() }),
        fetch(`/admin/transfer-requests?status=${encodeURIComponent(status)}`, { headers: authHeaders() }),
      ]);
      if (bookingsRes.status === 403 || transfersRes.status === 403) {
        alert('Admin access required.');
        window.location.href = 'login.html';
        return;
      }
      const bookings = await bookingsRes.json();
      const transfers = await transfersRes.json();
      const items = [
        ...bookings.map((item) => ({ ...item, kind: 'booking' })),
        ...transfers.map((item) => ({ ...item, kind: 'transfer' })),
      ].sort((a, b) => new Date(b.requested_at) - new Date(a.requested_at));

      document.getElementById('bookingCountSub').textContent =
        `${items.length} request${items.length === 1 ? '' : 's'}${status !== 'all' ? ' · ' + status : ''}`;

      if (!items.length) {
        list.innerHTML = `
          <div class="empty-state card">
            <div class="empty-icon"><svg viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4 4 10-10" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
            <h3>Nothing here</h3>
            <p>No bookings or transfer requests match this filter.</p>
          </div>`;
        return;
      }

      list.innerHTML = items.map((item) => item.kind === 'transfer' ? transferRequestRowHTML(item) : bookingRowHTML(item)).join('');
      list.querySelectorAll('[data-action="approve"]').forEach((btn) =>
        btn.addEventListener('click', () => decideBooking(btn.dataset.id, 'approve')));
      list.querySelectorAll('[data-action="reject"]').forEach((btn) =>
        btn.addEventListener('click', () => decideBooking(btn.dataset.id, 'reject')));
      list.querySelectorAll('[data-action="approve-transfer"]').forEach((btn) =>
        btn.addEventListener('click', () => decideTransferRequest(btn.dataset.id, 'approve')));
      list.querySelectorAll('[data-action="reject-transfer"]').forEach((btn) =>
        btn.addEventListener('click', () => decideTransferRequest(btn.dataset.id, 'reject')));
    } catch (err) {
      list.innerHTML = '<p style="color:var(--error-fg);">Could not load bookings. Please try again.</p>';
    }
  }

  async function decideBooking(id, action) {
    try {
      const res = await fetch(`/admin/bookings/${id}/${action}`, { method: 'POST', headers: authHeaders() });
      if (!res.ok && res.status !== 204) {
        const body = await res.json().catch(() => ({}));
        alert(body.detail || `Could not ${action} the booking (status ${res.status}).`);
        return;
      }
      loadBookings();
    } catch (err) {
      alert('Network error — please check your connection and try again.');
    }
  }

  async function decideTransferRequest(id, action) {
    try {
      const res = await fetch(`/admin/transfer-requests/${id}/${action}`, { method: 'POST', headers: authHeaders() });
      if (!res.ok && res.status !== 204) { alert('Could not update transfer request.'); return; }
      loadBookings();
    } catch (err) {
      alert('Network error — please try again.');
    }
  }

  document.getElementById('statusFilter').addEventListener('change', loadBookings);
  loadBookings();
</script>
</body>
</html>
